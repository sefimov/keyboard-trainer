<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клавиатурный тренажер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Клавиатурный тренажер</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Слово:</span>
                    <span id="word-number">0</span> / <span id="total-words">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Ошибок:</span>
                    <span id="errors">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Точность:</span>
                    <span id="accuracy">100%</span>
                </div>
            </div>
        </header>

        <main>
            <div class="word-display">
                <div id="current-word" class="word-text"></div>
                <div id="input-display" class="input-display"></div>
            </div>

            <div class="keyboard-container">
                <div id="keyboard" class="keyboard"></div>
            </div>

            <div class="controls">
                <button id="start-btn" class="btn btn-primary">Начать</button>
                <button id="reset-btn" class="btn btn-secondary">Сбросить</button>
                <button id="settings-btn" class="btn btn-settings">⚙️ Настройки</button>
            </div>

            <!-- Панель настроек доступности -->
            <div id="settings-panel" class="settings-panel" style="display: none;">
                <h3>Настройки для комфортной работы</h3>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="sound-feedback">
                            <span>Звуковая обратная связь</span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="simplified-mode" checked>
                            <span>Упрощенный режим</span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <span>Размер текста:</span>
                            <select id="font-size">
                                <option value="normal">Обычный</option>
                                <option value="large" selected>Крупный</option>
                                <option value="extra-large">Очень крупный</option>
                            </select>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="high-contrast">
                            <span>Высокий контраст</span>
                        </label>
                    </div>
                    <div class="setting-item setting-item-full">
                        <label>
                            <span>Слова для тренировки (по одному на строку):</span>
                            <textarea id="custom-words" rows="10" placeholder="привет&#10;мир&#10;компьютер&#10;клавиатура"></textarea>
                        </label>
                        <button id="save-words-btn" class="btn btn-primary" style="margin-top: 10px;">Сохранить слова</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Оверлей с Мэтром и салютом -->
    <div id="celebration-overlay" class="celebration-overlay">
        <div class="celebration-content">
            <img id="mater-image" src="img/m.png" alt="Мэтр" class="mater-image">
            <div class="fireworks">
                <div class="firework"></div>
                <div class="firework"></div>
                <div class="firework"></div>
                <div class="firework"></div>
                <div class="firework"></div>
                <div class="firework"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
